name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }} / node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        node: [18, 20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: install
        run: npm ci || npm install
      - name: build
        run: npm run build
      - name: unit tests
        run: npm test
      - name: mutation recall gate
        run: npm run mutation
      - name: corpus replay (offline)
        run: npm run corpus

  # Corpus replay must pass with the network disabled — proves it is truly offline.
  corpus-offline:
    name: corpus replay (network disabled)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - name: replay with no network
        run: |
          # Block outbound network to prove the replay uses only cached fixtures.
          sudo unshare -n node dist/bench/corpus/replay.js
